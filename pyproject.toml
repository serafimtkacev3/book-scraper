[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "book-scraper"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "aiohttp",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]